<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
        }
        .pdf-container {
            width: 100%;
            height: 100vh;
            border: 0px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-top: 0px;
        }
        embed {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    
    <div class="pdf-container">
        <!-- Change "yourfile.pdf" to your actual PDF file name -->
        <embed src="FLINS-ISKE.pdf" type="application/pdf">
    </div>
</body>
</html>
